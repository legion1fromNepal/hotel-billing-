<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF--8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Bill Payment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Define colors using CSS variables
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              background: 'var(--color-background)',
              text: 'var(--color-text)',
              'text-header': 'var(--color-text-header)',
              'text-secondary': 'var(--color-text-secondary)',
              'text-primary': 'var(--color-text-primary)',
              'text-button': 'var(--color-text-button)',
              'text-muted': 'var(--color-text-muted)',
              'card-background': 'var(--color-card-background)',
              'input-background': 'var(--color-input-background)',
              'border-color': 'var(--color-border)',
              'bill-summary-background': 'var(--color-bill-summary-background)',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style>
      /* Light Theme Variables (White Background, Brown Text) */
      html[data-theme='light'] {
        --color-primary: #7C4D3C; /* Medium Brown */
        --color-secondary: #2A1A17; /* Very Dark Brown */
        --color-accent: #BF5700; /* Burnt Orange/Brown */
        --color-background: #FFFFFF; /* Pure white */
        --color-text: #2A1A17; /* Very Dark Brown */
        --color-text-header: #FFFFFF;
        --color-text-secondary: #2A1A17;
        --color-text-primary: #A16207; /* Darker Amber/Brownish Orange */
        --color-text-button: #FFFFFF;
        --color-text-muted: #8D6E63; /* Muted Brown */
        --color-card-background: #FFFFFF;
        --color-input-background: #F5EFE6; /* Very light brown/off-white */
        --color-border: #D7CCC8; /* Light Brown */
        --color-bill-summary-background: #E6EAD0; /* Olive Green */
      }

      /* Dark Theme Variables (Black Background, Creamy Text, Sky Blue accents) */
      html[data-theme='dark'] {
        --color-primary: #F59E0B; /* Amber-500, vibrant orange-brown */
        --color-secondary: rgb(25, 25, 25); /* Darker gray for secondary elements */
        --color-accent: #FCD34D; /* Amber-300, brighter yellow-orange */
        --color-background: rgb(0, 0, 0); /* Pure Black */
        --color-text: #F5EFE6; /* Creamy White/Light Beige */
        --color-text-header: #FFFFFF;
        --color-text-secondary: #F5EFE6;
        --color-text-primary: #FB8F3F; /* Lighter Orange-Brown */
        --color-text-button: #FFFFFF;
        --color-text-muted: rgb(90, 90, 90); /* Muted gray for dark mode */
        --color-card-background: rgb(40, 40, 40); /* Dark gray for cards */
        --color-input-background: rgb(40, 40, 40); /* Slightly lighter dark gray for inputs */
        --color-border: rgb(211, 215, 202); /* Muted gray for borders */
        --color-bill-summary-background: #9ca57e; /* Olive Green */
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
